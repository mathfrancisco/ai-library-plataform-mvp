name: Provider smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  providers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: CHAVES
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
      OPEN_LIBRARY_USER_AGENT: ${{ secrets.OPEN_LIBRARY_USER_AGENT }}
    steps:
      - name: Check provider credentials and responses
        shell: python
        run: |
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          def request(url, headers=None, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, headers=headers or {})
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  media_type = exc.headers.get_content_type()
                  try:
                      error = json.load(exc).get("error", {})
                      code = error.get("code") or error.get("type") or ""
                  except (ValueError, AttributeError):
                      code = ""
                  detail = f" ({code})" if isinstance(code, str) and re.fullmatch(r"[A-Za-z0-9_-]{1,80}", code) else ""
                  raise RuntimeError(f"HTTP {exc.code} [{media_type}]{detail}") from None
              except urllib.error.URLError:
                  raise RuntimeError("network request failed") from None

          for name in ("GROQ_API_KEY", "GOOGLE_BOOKS_API_KEY", "OPEN_LIBRARY_USER_AGENT"):
              if not os.environ.get(name, "").strip():
                  sys.exit(f"Missing environment secret: {name}")

          def check_groq_reachability():
              try:
                  urllib.request.urlopen("https://api.groq.com/openai/v1/models", timeout=20)
              except urllib.error.HTTPError as exc:
                  if exc.code == 401:
                      return
                  raise RuntimeError(f"unauthenticated request returned HTTP {exc.code}") from None
              except urllib.error.URLError:
                  raise RuntimeError("network request failed") from None
              raise RuntimeError("unauthenticated request unexpectedly succeeded")

          def check_groq_models():
              models = request(
                  "https://api.groq.com/openai/v1/models",
                  {"Authorization": "Bearer " + os.environ["GROQ_API_KEY"]},
              )
              if not models.get("data"):
                  raise RuntimeError("response has no models")

          def check_groq_chat():
              groq = request(
                  "https://api.groq.com/openai/v1/chat/completions",
                  {
                      "Authorization": "Bearer " + os.environ["GROQ_API_KEY"],
                      "Content-Type": "application/json",
                  },
                  {
                      "model": "llama-3.1-8b-instant",
                      "messages": [{"role": "user", "content": "Reply OK"}],
                      "max_tokens": 8,
                  },
              )
              if not groq.get("choices"):
                  raise RuntimeError("response has no choices")

          def check_google():
              google_url = "https://www.googleapis.com/books/v1/volumes?" + urllib.parse.urlencode({
                  "q": "isbn:9780140328721",
                  "maxResults": 1,
                  "key": os.environ["GOOGLE_BOOKS_API_KEY"],
              })
              google = request(google_url)
              if not google.get("items"):
                  raise RuntimeError("response has no items")

          def check_open_library():
              open_library = request(
                  "https://openlibrary.org/search.json?q=matilda&limit=1",
                  {"User-Agent": os.environ["OPEN_LIBRARY_USER_AGENT"]},
              )
              if not open_library.get("docs"):
                  raise RuntimeError("response has no docs")

          failures = []
          for name, check in (
              ("Groq reachability", check_groq_reachability),
              ("Groq models", check_groq_models),
              ("Groq chat", check_groq_chat),
              ("Google Books", check_google),
              ("Open Library", check_open_library),
          ):
              try:
                  check()
                  print(f"{name}: OK")
              except RuntimeError as exc:
                  print(f"{name}: {exc}")
                  failures.append(name)
          if failures:
              sys.exit(1)
