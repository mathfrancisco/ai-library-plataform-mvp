name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: backend } }
    env:
      # Local ONNX embedding model (~90 MB) and DJL tokenizer libraries, cached between runs.
      AI_EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.cache/onnx
      DJL_CACHE_DIR: ${{ github.workspace }}/.cache/djl
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/cache@v4
        with:
          path: |
            .cache/onnx
            .cache/djl
          key: onnx-all-MiniLM-L6-v2-v1
      - run: ./mvnw -B verify -Dtestcontainers.required=true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          push: false
          load: true
          tags: ai-library-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Image runs as non-root
        run: test "$(docker run --rm --entrypoint id ai-library-${{ matrix.image }}:ci -u)" != "0"
      - name: Vulnerability scan (report only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ai-library-${{ matrix.image }}:ci
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v7
      - name: Fresh clone without .env starts and becomes healthy
        run: |
          test ! -f .env
          docker compose up --build -d --wait --wait-timeout 600
          docker compose ps
          test "$(docker compose exec -T backend id -u)" != "0"
          test "$(docker compose exec -T frontend id -u)" != "0"
          curl -fs http://localhost:3000/ > /dev/null
          # The same-origin proxy reaches the backend: an unknown book is a backend 404, not a proxy error.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/books/00000000-0000-0000-0000-000000000000)
          test "$code" = 404
      - if: always()
        run: docker compose logs --no-color | tail -200
