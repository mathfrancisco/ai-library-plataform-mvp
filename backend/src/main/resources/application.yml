spring:
  application:
    name: ai-library
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ailibrary}
    username: ${SPRING_DATASOURCE_USERNAME:ailibrary}
    password: ${SPRING_DATASOURCE_PASSWORD:ailibrary}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:disabled}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4.1-mini}
          temperature: 0.2
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    vectorstore:
      pgvector:
        initialize-schema: false
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: ${AI_EMBEDDING_DIMENSIONS:1536}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

server:
  error:
    include-message: never

app:
  ai:
    enabled: ${AI_ENABLED:false}
    provider: openai-compatible
    model: ${OPENAI_CHAT_MODEL:gpt-4.1-mini}
  auth:
    jwt-secret: ${JWT_SECRET:change-me-with-at-least-32-characters-long-secret}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  upload:
    dir: ${APP_UPLOAD_DIR:./uploads}
    max-bytes: 26214400
  catalog:
    open-library:
      user-agent: ${OPEN_LIBRARY_USER_AGENT:AILibraryPortfolio/0.1 (contact: replace@example.com)}
      base-url: https://openlibrary.org
    google-books:
      api-key: ${GOOGLE_BOOKS_API_KEY:}
      base-url: https://www.googleapis.com/books/v1

logging:
  level:
    org.springframework.ai: INFO
